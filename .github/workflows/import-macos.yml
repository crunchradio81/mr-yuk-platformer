name: Import native macOS project

on:
  push:
    branches: ["main"]
    paths:
      - ".macos-upload/**"
      - ".github/workflows/import-macos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand native project
        shell: bash
        run: |
          set -euo pipefail
          test -f .macos-upload/MrYukPoisonPatrol-macOS-source.zip
          rm -rf macOS
          mkdir -p macOS
          unzip -q .macos-upload/MrYukPoisonPatrol-macOS-source.zip -d macOS
          rm -rf .macos-upload

      - name: Commit native source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A macOS .macos-upload || true
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Add native macOS Xcode project"
          git push origin HEAD:main
