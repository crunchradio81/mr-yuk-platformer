function groundPlatformAt(x,y){for(const p of level.platforms){const top=p.y+p.h;if(x+10>p.x&&x-10<p.x+p.w&&Math.abs((y-16)-top)<6)return p}return null}

function platformForEnemy(e){let best=null,bestD=1e9;for(const p of level.platforms){if(e.x>=p.x-18&&e.x<=p.x+p.w+18){const d=Math.abs((p.y+p.h+16)-e.y);if(d<bestD){bestD=d;best=p}}}return best}
function updateEnemyRange(e){const p=platformForEnemy(e);if(p){e.minX=p.x+14;e.maxX=p.x+p.w-14;e.x=Math.max(e.minX,Math.min(e.maxX,e.x));}}
function ladderEndpoints(l){const mid=l.x+l.w/2;const vals=level.platforms.filter(p=>mid>=p.x-4&&mid<=p.x+p.w+4).map(p=>p.y+p.h+16);if(vals.length<2)return null;let low=vals[0],high=vals[0],dl=1e9,dh=1e9;for(const v of vals){const a=Math.abs((v-16)-l.y),b=Math.abs((v-16)-(l.y+l.h));if(a<dl){dl=a;low=v}if(b<dh){dh=b;high=v}}if(Math.abs(high-low)<=20)return null;return low<high?[low,high]:[high,low];}
function decideEnemy(e){if(e.state!=='patrol'||e.stun>0)return;const gap=player.y-e.y;if(Math.abs(gap)<30){if(Math.abs(player.x-e.x)>10)e.dir=player.x<e.x?-1:1;return}let best=null;for(const l of level.ladders){const ends=ladderEndpoints(l);if(!ends)continue;const [lo,hi]=ends;let cur=null;if(Math.abs(e.y-lo)<18)cur=lo;else if(Math.abs(e.y-hi)<18)cur=hi;if(cur===null)continue;const target=Math.abs(cur-lo)<1?hi:lo;if(gap>0&&target<=cur)continue;if(gap<0&&target>=cur)continue;const cost=Math.abs((l.x+l.w/2)-e.x)+Math.abs(target-player.y)*.25;if(!best||cost<best.cost)best={l,target,cost}}if(best){e.state='seeking';e.ladder=best.l;e.targetY=best.target;e.dir=(best.l.x+best.l.w/2)<e.x?-1:1}else e.dir=player.x<e.x?-1:1;}

}

function render(){ctx.clearRect(0,0,W,H);if(mode==='attract')drawAttract();else if(mode==='playing'||mode==='dying')drawWorld();else if(mode==='interstitial')drawInterstitial();else if(mode==='gameover')drawGameOver();else drawFinished();if(paused&&mode==='playing'){ctx.fillStyle='#000c';ctx.fillRect(0,38,640,425);rounded(110,145,420,190,8,COLORS.panel,COLORS.green,3);text('PSA TRANSMISSION PAUSED',320,196,18,COLORS.green);text('P / ESC  RESUME     M  MUSIC     R  RESTART EPISODE',320,238,8,COLORS.cream);text('POISON HELP  1-800-222-1222',320,279,11,COLORS.yellow)}drawCRT();}
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame)}

function activateEnter(){if(mode==='attract'||mode==='gameover')startGame();else if(mode==='interstitial'){if(levelIndex<LEVELS.length-1)loadLevel(levelIndex+1);else{hi=Math.max(hi,score);localStorage.setItem('mryuk-hi',String(hi));mode='finished';syncMusic();statusEl.textContent='Campaign complete.'}}else if(mode==='finished'){mode='attract';syncMusic();statusEl.textContent='Press Enter to start.'}}
function togglePause(){if(mode!=='playing')return;paused=!paused;syncMusic();pauseBtn.textContent=paused?'Resume':'Pause';statusEl.textContent=paused?'Paused.':'Playing.';}
function restartLevel(){if((mode==='playing'||paused)&&level)loadLevel(levelIndex)}
function handleKeyDown(e){if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.repeat)return;if(e.code==='Enter')activateEnter();else if(e.code==='KeyZ')requestJump();else if(e.code==='Space')sealOrThrow();else if(e.code==='KeyP'||e.code==='Escape')togglePause();else if(e.code==='KeyM')toggleMusic();else if(e.code==='KeyR')restartLevel();}
function handleKeyUp(e){keys.delete(e.code)}
window.addEventListener('keydown',handleKeyDown);window.addEventListener('keyup',handleKeyUp);
canvas.addEventListener('pointerdown',()=>canvas.focus());
startBtn.addEventListener('click',()=>{canvas.focus();activateEnter();});pauseBtn.addEventListener('click',()=>{canvas.focus();togglePause();});musicBtn.addEventListener('click',()=>{canvas.focus();toggleMusic();});
window.addEventListener('blur',()=>{keys.clear();if(mode==='playing'&&!paused){paused=true;syncMusic();pauseBtn.textContent='Resume';statusEl.textContent='Paused because the window lost focus.';}});
canvas.focus();requestAnimationFrame(frame);
})();
