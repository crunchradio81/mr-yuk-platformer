<title>Mr. Yuk's Poison Patrol — Web Edition</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#050805;color:#e9ffe0;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;min-height:100%;}
  body{display:grid;place-items:center;padding:18px;}
  .wrap{width:min(100%,980px)}
  .frame{background:#020402;border:2px solid #5dff42;border-radius:14px;padding:12px;box-shadow:0 0 28px #1d5f1855}
  canvas{display:block;width:100%;aspect-ratio:4/3;background:#050805;image-rendering:pixelated;outline:none;border-radius:4px}
  canvas:focus-visible{outline:2px solid #ffe352;outline-offset:4px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
  button{font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:10px 14px;min-height:40px;border:1px solid #68ff49;background:#071008;color:#e9ffe0;border-radius:6px;cursor:pointer}
  button:hover{background:#0d180e} button:focus-visible{outline:2px solid #ffe352;outline-offset:2px}
  .help{font-size:12px;line-height:1.5;color:#bdc9b8;margin-top:9px;text-align:center}
  .help b{color:#68ff49}
  .status{font-size:11px;color:#98ff78;text-align:center;min-height:16px;margin-top:7px}

  .mobile-controls{display:none;margin-top:12px;gap:14px;align-items:center;justify-content:space-between;touch-action:none;user-select:none;-webkit-user-select:none}
  .mobile-dpad{display:grid;grid-template-columns:64px 64px 64px;grid-template-rows:56px 56px 56px;gap:6px;flex:0 0 auto}
  .mobile-actions{display:grid;grid-template-columns:76px 76px;grid-template-rows:64px 48px;gap:10px;flex:0 0 auto}
  .touch-btn{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;padding:0;border:2px solid #68ff49;border-radius:12px;background:#071008;color:#eff0df;font:800 16px/1 ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:inset 0 0 0 2px #183a18;touch-action:none;-webkit-tap-highlight-color:transparent}
  .touch-btn:active,.touch-btn.active{background:#183a18;transform:translateY(1px)}
  .touch-btn.action{border-color:#ffe352;color:#ffe352}
  .touch-btn.yuk{border-color:#98ff78;color:#98ff78}
  .touch-btn.small{font-size:11px;border-width:1px}
  .d-up{grid-column:2;grid-row:1}.d-left{grid-column:1;grid-row:2}.d-down{grid-column:2;grid-row:2}.d-right{grid-column:3;grid-row:2}
  .mobile-center{grid-column:2;grid-row:3;font-size:9px;color:#98ff78;display:flex;align-items:center;justify-content:center;opacity:.75}
  .touch-note{display:none;text-align:center;font-size:10px;color:#98ff78;margin-top:6px}
  @media (pointer:coarse), (max-width:760px){
    body{padding:8px;place-items:start center}
    .frame{padding:6px;border-radius:9px}
    .help{font-size:9px;line-height:1.35}
    .controls{margin-top:8px}
    .controls button{min-height:36px;padding:8px 10px;font-size:10px}
    .mobile-controls{display:flex}
    .touch-note{display:block}
  }
  @media (max-width:430px){
    .mobile-controls{gap:8px}
    .mobile-dpad{grid-template-columns:58px 58px 58px;grid-template-rows:52px 52px 46px;gap:5px}
    .mobile-actions{grid-template-columns:70px 70px;grid-template-rows:60px 44px;gap:8px}
    .touch-btn{font-size:15px;border-radius:10px}
    .touch-btn.small{font-size:10px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="frame"><canvas id="game" width="640" height="480" tabindex="0" aria-label="Mr. Yuk Poison Patrol browser game"></canvas></div>
  <div class="controls" aria-label="Game controls">
    <button id="startBtn" type="button">Start / Continue</button>
    <button id="pauseBtn" type="button">Pause</button>
    <button id="musicBtn" type="button">Music: On</button>
  </div>
  <div class="help"><b>Move:</b> arrows/WASD &nbsp; <b>Jump:</b> Z &nbsp; <b>Seal / toss sticker:</b> Space &nbsp; <b>Pause:</b> P/Esc &nbsp; <b>Music:</b> M &nbsp; <b>Start/continue:</b> Enter</div>
  <div id="status" class="status" aria-live="polite">Click the game or press Start to focus controls.</div>
  <div class="mobile-controls" id="mobileControls" aria-label="Mobile game controls">

function platformForEnemy(e){let best=null,bestD=1e9;for(const p of level.platforms){if(e.x>=p.x-18&&e.x<=p.x+p.w+18){const d=Math.abs((p.y+p.h+16)-e.y);if(d<bestD){bestD=d;best=p}}}return best}
function updateEnemyRange(e){const p=platformForEnemy(e);if(p){e.minX=p.x+14;e.maxX=p.x+p.w-14;e.x=Math.max(e.minX,Math.min(e.maxX,e.x));}}
function ladderEndpoints(l){const mid=l.x+l.w/2;const vals=level.platforms.filter(p=>mid>=p.x-4&&mid<=p.x+p.w+4).map(p=>p.y+p.h+16);if(vals.length<2)return null;let low=vals[0],high=vals[0],dl=1e9,dh=1e9;for(const v of vals){const a=Math.abs((v-16)-l.y),b=Math.abs((v-16)-(l.y+l.h));if(a<dl){dl=a;low=v}if(b<dh){dh=b;high=v}}if(Math.abs(high-low)<=20)return null;return low<high?[low,high]:[high,low];}
function decideEnemy(e){if(e.state!=='patrol'||e.stun>0)return;const gap=player.y-e.y;if(Math.abs(gap)<30){if(Math.abs(player.x-e.x)>10)e.dir=player.x<e.x?-1:1;return}let best=null;for(const l of level.ladders){const ends=ladderEndpoints(l);if(!ends)continue;const [lo,hi]=ends;let cur=null;if(Math.abs(e.y-lo)<18)cur=lo;else if(Math.abs(e.y-hi)<18)cur=hi;if(cur===null)continue;const target=Math.abs(cur-lo)<1?hi:lo;if(gap>0&&target<=cur)continue;if(gap<0&&target>=cur)continue;const cost=Math.abs((l.x+l.w/2)-e.x)+Math.abs(target-player.y)*.25;if(!best||cost<best.cost)best={l,target,cost}}if(best){e.state='seeking';e.ladder=best.l;e.targetY=best.target;e.dir=(best.l.x+best.l.w/2)<e.x?-1:1}else e.dir=player.x<e.x?-1:1;}
function updateEnemy(e,dt){if(e.stun>0){e.stun=Math.max(0,e.stun-dt);return}e.nextDecision-=dt;if(e.nextDecision<=0){const [lo,hi]=enemyDecisionDelay();e.nextDecision=lo+Math.random()*(hi-lo);decideEnemy(e)}if(e.state==='patrol'){e.x+=e.speed*e.dir*dt;updateEnemyRange(e);if(e.x<=e.minX){e.x=e.minX;e.dir=1}else if(e.x>=e.maxX){e.x=e.maxX;e.dir=-1}}else if(e.state==='seeking'){const lx=e.ladder.x+e.ladder.w/2,dx=lx-e.x;e.dir=dx<0?-1:1;e.x+=e.speed*e.dir*dt;if(Math.abs(dx)<3.5){e.x=lx;e.state='climbing'}else updateEnemyRange(e)}else if(e.state==='climbing'){const lx=e.ladder.x+e.ladder.w/2;e.x+=(lx-e.x)*Math.min(1,16*dt);const dy=e.targetY>e.y?1:-1;e.y+=88*dy*dt;if(Math.abs(e.targetY-e.y)<=3.5||(dy>0&&e.y>=e.targetY)||(dy<0&&e.y<=e.targetY)){e.y=e.targetY;e.state='patrol';e.dir=player.x<e.x?-1:1;updateEnemyRange(e)}}}

function executeBufferedJump(){if(elapsed>player.jumpBufferUntil)return;if(player.onLadder){player.onLadder=false;player.vy=260;player.vx=player.facing*115;player.jumpBufferUntil=0;playSound('jump',.38);return}if(elapsed-player.lastGroundedAt<=.12){player.vy=285;player.jumpBufferUntil=0;playSound('jump',.38)}}

function drawGameOver(){rect(0,0,640,480,'#030503');rounded(70,80,500,320,10,COLORS.panel,COLORS.red,4);rounded(84,94,472,292,8,'#071008','#98ff7828');rounded(96,105,448,22,4,'#ff575718','#ff575788');text('EMERGENCY INTERRUPTION • CHANNEL 13',320,116,9,COLORS.red);text('TOXIC TROUBLE!',320,170,26,COLORS.green);rounded(110,205,420,105,6,'#ffffff08','#68ff4938');text(`SCORE ${String(score).padStart(6,'0')} • HIGH SCORE ${String(hi).padStart(6,'0')}`,320,229,11,COLORS.cream);text('THE BAD STUFF GOT LOOSE.',320,262,12,COLORS.yellow);text('POISON HELP • 1-800-222-1222',320,291,14,COLORS.yellow);text('PRESS ENTER / START TO TRY AGAIN',320,350,10,COLORS.green)}
function drawFinished(){rect(0,0,640,480,'#030503');rounded(48,38,544,404,10,COLORS.panel,COLORS.green,4);rounded(60,50,520,380,8,'#071008','#98ff7828');text('PUBLIC SERVICE SIGN-OFF • CHANNEL 13',320,66,9,COLORS.yellow);circle(320,139,64,'#68ff490d','#68ff4935');img('MrYukReference',320,139,112,112);text('REMEMBER MR. YUK!',320,215,24,COLORS.green);rounded(92,245,456,105,6,'#ffffff08','#68ff4938');text(`FINAL SCORE ${String(score).padStart(6,'0')} • HIGH SCORE ${String(hi).padStart(6,'0')}`,320,269,11,COLORS.cream);text("STOP • LOOK • DON'T TOUCH • GET HELP",320,303,12,COLORS.yellow);text('POISON HELP • 1-800-222-1222',320,331,14,COLORS.yellow);text('PRESS ENTER / START TO PLAY AGAIN',320,397,10,COLORS.green)}
function drawCRT(){ctx.fillStyle='#00000018';for(let y=0;y<480;y+=4)ctx.fillRect(0,y,640,1);const ty=(elapsed*112)%490-5;rect(0,ty,640,3,'#ffffff0b');if(staticBurstTimer>0){for(let i=0;i<22;i++){const y=Math.random()*480,h=Math.random()<.7?1:2;rect(Math.random()*590,y,30+Math.random()*120,h,'#ffffff'+(Math.floor(25+Math.random()*35)).toString(16).padStart(2,'0'))}}else{for(let i=0;i<5;i++)rect(Math.random()*610,Math.random()*480,10+Math.random()*60,1,'#ffffff08')}}
function render(){ctx.clearRect(0,0,W,H);if(mode==='attract')drawAttract();else if(mode==='playing'||mode==='dying')drawWorld();else if(mode==='interstitial')drawInterstitial();else if(mode==='gameover')drawGameOver();else drawFinished();if(paused&&mode==='playing'){ctx.fillStyle='#000c';ctx.fillRect(0,38,640,425);rounded(110,145,420,190,8,COLORS.panel,COLORS.green,3);text('PSA TRANSMISSION PAUSED',320,196,18,COLORS.green);text('P / ESC  RESUME     M  MUSIC     R  RESTART EPISODE',320,238,8,COLORS.cream);text('POISON HELP  1-800-222-1222',320,279,11,COLORS.yellow)}drawCRT();}
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame)}

function activateEnter(){if(mode==='attract'||mode==='gameover')startGame();else if(mode==='interstitial'){if(levelIndex<LEVELS.length-1)loadLevel(levelIndex+1);else{hi=Math.max(hi,score);localStorage.setItem('mryuk-hi',String(hi));mode='finished';syncMusic();statusEl.textContent='Campaign complete.'}}else if(mode==='finished'){mode='attract';syncMusic();statusEl.textContent='Press Enter to start.'}}
function togglePause(){if(mode!=='playing')return;paused=!paused;syncMusic();pauseBtn.textContent=paused?'Resume':'Pause';statusEl.textContent=paused?'Paused.':'Playing.';}
function restartLevel(){if((mode==='playing'||paused)&&level)loadLevel(levelIndex)}
function handleKeyDown(e){if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.repeat)return;if(e.code==='Enter')activateEnter();else if(e.code==='KeyZ')requestJump();else if(e.code==='Space')sealOrThrow();else if(e.code==='KeyP'||e.code==='Escape')togglePause();else if(e.code==='KeyM')toggleMusic();else if(e.code==='KeyR')restartLevel();}
function handleKeyUp(e){keys.delete(e.code)}
window.addEventListener('keydown',handleKeyDown);window.addEventListener('keyup',handleKeyUp);
canvas.addEventListener('pointerdown',()=>canvas.focus());
startBtn.addEventListener('click',()=>{canvas.focus();activateEnter();});pauseBtn.addEventListener('click',()=>{canvas.focus();togglePause();});musicBtn.addEventListener('click',()=>{canvas.focus();toggleMusic();});
// Mobile / touch controls. Movement buttons behave like held keyboard keys.
function bindHoldButton(btn,code){
  if(!btn)return;
  const release=()=>{keys.delete(code);btn.classList.remove('active')};
  btn.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudioGesture();try{btn.setPointerCapture(e.pointerId)}catch{}keys.add(code);btn.classList.add('active');canvas.focus()});
  btn.addEventListener('pointerup',e=>{e.preventDefault();release()});
  btn.addEventListener('pointercancel',release);
  btn.addEventListener('lostpointercapture',release);
  btn.addEventListener('contextmenu',e=>e.preventDefault());
}
function bindTapButton(btn,fn){if(!btn)return;btn.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudioGesture();btn.classList.add('active');canvas.focus();fn()});const off=()=>btn.classList.remove('active');btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('lostpointercapture',off);btn.addEventListener('contextmenu',e=>e.preventDefault())}
function ensureAudioGesture(){if(themeAudio&&themeAudio.paused&&musicEnabled&&mode==='playing'&&!paused)themeAudio.play().catch(()=>{})}
document.querySelectorAll('[data-hold]').forEach(btn=>bindHoldButton(btn,btn.dataset.hold));
bindTapButton(touchJump,requestJump);
bindTapButton(touchYuk,sealOrThrow);
bindTapButton(touchStart,activateEnter);
bindTapButton(touchPause,togglePause);
window.addEventListener('blur',()=>{keys.clear();if(mode==='playing'&&!paused){paused=true;syncMusic();pauseBtn.textContent='Resume';statusEl.textContent='Paused because the window lost focus.';}});
canvas.focus();requestAnimationFrame(frame);
})();
</script>
